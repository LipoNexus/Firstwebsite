<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liver Health Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080c10;
    --panel: #0d1318;
    --border: rgba(255,255,255,0.07);
    --text: #c8d4dc;
    --accent: #2a8a6e;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(42,138,110,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 100%, rgba(139,58,42,0.06) 0%, transparent 60%);
  }
  header { text-align: center; margin-bottom: 2.5rem; }
  header h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 400;
    color: #e8eef2;
    line-height: 1.1;
  }
  header h1 em { font-style: italic; color: var(--accent); }
  header p {
    margin-top: 0.5rem;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(200,212,220,0.45);
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem 2rem;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
  }

  /* Image container */
  .image-wrapper {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    cursor: col-resize;
    user-select: none;
    touch-action: none;
    background: #000;
  }
  canvas { display: block; width: 100%; height: auto; pointer-events: none; }

  /* Divider line */
  .divider {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(255,255,255,0.9) 15%,
      rgba(255,255,255,0.9) 85%,
      transparent 100%);
    transform: translateX(-50%);
    pointer-events: none;
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.4));
  }

  /* Handle */
  .handle {
    position: absolute;
    top: 50%;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 3px 16px rgba(0,0,0,0.55), 0 0 0 2px rgba(0,0,0,0.15);
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .handle svg { width: 18px; height: 18px; }
  .image-wrapper:active .handle {
    box-shadow: 0 3px 24px rgba(255,255,255,0.25), 0 0 0 4px rgba(255,255,255,0.12);
  }

  /* Corner labels */
  .corner-label {
    position: absolute;
    top: 10px;
    font-size: 0.58rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    pointer-events: none;
    font-family: 'DM Mono', monospace;
  }
  .corner-label--left  { left: 10px;  background: rgba(50,175,80,0.22);  color: rgb(87,209,84); border: 1px solid rgba(60,190,80,0.4); }
  .corner-label--right { right: 10px; background: rgba(80,30,50,0.35); color: rgba(190,130,140,0.9); border: 1px solid rgba(130,60,70,0.4); }

  /* Status */
  .status-bar {
    margin-top: 1.6rem;
    padding: 1rem 1.2rem;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .status-icon { font-size: 1.3rem; flex-shrink: 0; }
  .status-label {
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(200,212,220,0.4);
    margin-bottom: 0.2rem;
  }
  .status-value { font-size: 0.85rem; color: #e8eef2; }

  .meter-wrap {
    margin-top: 1rem;
    display: flex; align-items: center; gap: 0.8rem;
  }
  .meter-label {
    font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(200,212,220,0.35); width: 90px; flex-shrink: 0;
  }
  .meter-track { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .meter-fill  { height: 100%; border-radius: 2px; transition: width 0.05s, background 0.3s; }
  .meter-val   { font-size: 0.65rem; width: 64px; text-align: right; color: rgba(200,212,220,0.5); flex-shrink: 0; }

  footer {
    margin-top: 1.8rem;
    font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(200,212,220,0.2); text-align: center;
  }
</style>
</head>
<body>

<div class="card">
  <div class="image-wrapper" id="wrapper">
    <canvas id="canvas"></canvas>
    <div class="divider" id="divider" style="left:50%"></div>
    <div class="handle"  id="handle"  style="left:50%">
      <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 3L2 9l4 6M12 3l4 6-4 6" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="corner-label corner-label--left"  id="lblLeft">Healthy</div>
    <div class="corner-label corner-label--right" id="lblRight">Cirrhosis</div>
  </div>

  <div class="status-bar">
    <div class="status-icon" id="statusIcon">🟢</div>
    <div>
      <div class="status-label">Current stage</div>
      <div class="status-value" id="statusValue">Healthy Liver</div>
    </div>
  </div>

  <div class="meter-wrap">
    <div class="meter-label">Fibrosis</div>
    <div class="meter-track"><div class="meter-fill" id="mFib" style="width:2%;background:#2a8a6e;"></div></div>
    <div class="meter-val" id="vFib">F0 — None</div>
  </div>
  <div class="meter-wrap">
    <div class="meter-label">Fat Deposit</div>
    <div class="meter-track"><div class="meter-fill" id="mFat" style="width:0%;background:#b87a30;"></div></div>
    <div class="meter-val" id="vFat">< 5%</div>
  </div>
    <div class="meter-val" id="vPress">5 mmHg</div>
  </div>
</div>

<script>
const wrapper = document.getElementById('wrapper');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const divider = document.getElementById('divider');
const handle  = document.getElementById('handle');

// Color ramp: t=0 (healthy/original) → t=1 (cirrhotic)
// Color stops: t=0 (healthy red/orange) → t=1 (cirrhosis purple-brown)
// Left of divider shows the color AT frac; right stays healthy.
// Grade 1 = yellow, Grade 2 = brown, F3 = dark brown, F4 = dark purple-brown
const colorStops = [
  [0.00, null],              // healthy — original red/orange pixel
  [0.25, [200, 170, 20]],   // Grade 1 — yellow
  [0.50, [140, 90,  30]],   // Grade 2 — brown
  [0.75, [ 90, 55,  30]],   // F3      — dark brown
  [1.00, [ 42, 18,  40]],   // F4      — very dark purple-brown (cirrhosis)
];

function lerpColor(a, b, t) {
  return [
    Math.round(a[0] + (b[0]-a[0])*t),
    Math.round(a[1] + (b[1]-a[1])*t),
    Math.round(a[2] + (b[2]-a[2])*t),
  ];
}

function getTargetColor(oR, oG, oB, t) {
  if (t <= 0) return [oR, oG, oB];
  for (let i = 1; i < colorStops.length; i++) {
    const [t0, c0] = colorStops[i-1];
    const [t1, c1] = colorStops[i];
    if (t <= t1) {
      const seg = (t - t0) / (t1 - t0);
      const start = c0 === null ? [oR, oG, oB] : c0;
      return lerpColor(start, c1, seg);
    }
  }
  return colorStops[colorStops.length-1][1];
}

// healthyBuf  = original image pixels
// cirrhoticBuf = fully cirrhotic pixels (t=1)
// Then for each frame we blend per-pixel across the split line.
// But since we want SHARP split (left=t=0, right=t=1 at current split),
// actually each side is a full render at its own t — so:
// Left of divider: original (t=0)
// Right of divider: t = full (1.0) — showing what full cirrhosis looks like on that portion
// This matches the original slider UX exactly.

let origPixels = null;
let maskPixels = null;
let stagedBuffers = null; // pre-baked buffer per color stop

function onLoad() {
  loaded++;
  if (loaded < 2) return;

  W = origImg.naturalWidth;
  H = origImg.naturalHeight;
  canvas.width  = W;
  canvas.height = H;

  // Extract original
  ctx.drawImage(origImg, 0, 0);
  origPixels = new Uint8ClampedArray(ctx.getImageData(0, 0, W, H).data);

  // Extract mask
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.drawImage(maskImg, 0, 0, W, H);
  maskPixels = octx.getImageData(0, 0, W, H).data;

  // Pre-bake one buffer per color stop (t = 0, 0.25, 0.5, 0.75, 1.0)
  const avgOr = [240, 100, 5];
  const avgLuma = 0.299*avgOr[0] + 0.587*avgOr[1] + 0.114*avgOr[2];

  stagedBuffers = colorStops.map(([t]) => {
    const buf = new Uint8ClampedArray(origPixels.length);
    for (let i = 0; i < W * H; i++) {
      const p = i * 4;
      if (maskPixels[p] > 128) {
        const oR = origPixels[p], oG = origPixels[p+1], oB = origPixels[p+2];
        const lumaRatio = (0.299*oR + 0.587*oG + 0.114*oB) / avgLuma;
        const [tR, tG, tB] = getTargetColor(oR, oG, oB, t);
        buf[p]   = Math.min(255, Math.max(0, Math.round(tR * lumaRatio)));
        buf[p+1] = Math.min(255, Math.max(0, Math.round(tG * lumaRatio)));
        buf[p+2] = Math.min(255, Math.max(0, Math.round(tB * lumaRatio)));
        buf[p+3] = origPixels[p+3];
      } else {
        buf[p]   = origPixels[p];
        buf[p+1] = origPixels[p+1];
        buf[p+2] = origPixels[p+2];
        buf[p+3] = origPixels[p+3];
      }
    }
    return buf;
  });

  // Post-process F4 buffer (index 4) to add mottling
  const f4buf = stagedBuffers[4];
  const avgOr2 = [240, 100, 5];
  const avgLuma2 = 0.299*avgOr2[0] + 0.587*avgOr2[1] + 0.114*avgOr2[2];
  function pseudoRand(n) {
    let x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const p = (y * W + x) * 4;
      if (maskPixels[p] > 128) {
        // Multi-scale noise for mottling
        const noise =
          (pseudoRand(x * 0.07 + y * 0.13) - 0.5) * 28 +
          (pseudoRand(x * 0.19 + y * 0.31 + 7) - 0.5) * 14 +
          (pseudoRand(x * 0.41 + y * 0.61 + 13) - 0.5) * 8;
        f4buf[p]   = Math.min(255, Math.max(0, f4buf[p]   + noise * 1.1));
        f4buf[p+1] = Math.min(255, Math.max(0, f4buf[p+1] + noise * 0.7));
        f4buf[p+2] = Math.min(255, Math.max(0, f4buf[p+2] + noise * 0.9));
      }
    }
  }

  draw(0.25);
}

origImg.onload = onLoad;
maskImg.onload = onLoad;

// sliderFrac: 0 = all healthy (divider at left), 1 = all cirrhotic (divider at right)
let sliderFrac = 0.5;

function draw(frac) {
  if (!origPixels || !stagedBuffers) return;
  sliderFrac = frac;

  const splitX = Math.round(W * frac);

  // Get the interpolated buffer for the LEFT side at current frac
  // Find which two staged buffers to blend between
  let leftBuf;
  if (frac <= 0) {
    leftBuf = stagedBuffers[0];
  } else if (frac >= 1) {
    leftBuf = stagedBuffers[stagedBuffers.length - 1];
  } else {
    // Find segment
    let segIdx = 1;
    for (let i = 1; i < colorStops.length; i++) {
      if (frac <= colorStops[i][0]) { segIdx = i; break; }
    }
    const t0 = colorStops[segIdx-1][0];
    const t1 = colorStops[segIdx][0];
    const seg = (frac - t0) / (t1 - t0);
    const bufA = stagedBuffers[segIdx-1];
    const bufB = stagedBuffers[segIdx];
    // Blend the two buffers
    leftBuf = new Uint8ClampedArray(origPixels.length);
    for (let j = 0; j < origPixels.length; j += 4) {
      leftBuf[j]   = Math.round(bufA[j]   + (bufB[j]   - bufA[j])   * seg);
      leftBuf[j+1] = Math.round(bufA[j+1] + (bufB[j+1] - bufA[j+1]) * seg);
      leftBuf[j+2] = Math.round(bufA[j+2] + (bufB[j+2] - bufA[j+2]) * seg);
      leftBuf[j+3] = bufA[j+3];
    }
  }

  // Right side = always healthy (stagedBuffers[0] = t=0 = original)
  const rightBuf = stagedBuffers[0];

  const imageData = ctx.createImageData(W, H);
  const out = imageData.data;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const src = x < splitX ? leftBuf : rightBuf;
      out[i]   = src[i];
      out[i+1] = src[i+1];
      out[i+2] = src[i+2];
      out[i+3] = src[i+3];
    }
  }

  ctx.putImageData(imageData, 0, 0);

  // Position divider & handle
  const pct = (frac * 100) + '%';
  divider.style.left = pct;
  handle.style.left  = pct;

  updateInfo(frac);
}

const stages = [
  { max: 0.12, icon: '🟢', label: 'Healthy Liver',               fib: 'F0 — None',     fat: '< 5%' },
  { max: 0.30, icon: '🟡', label: 'Hepatic Steatosis (F1)', fib: 'F1 — Mild',     fat: '5–33%' },
  { max: 0.52, icon: '🟠', label: 'Steatohepatitis (F2)',   fib: 'F2 — Moderate', fat: '33–66%' },
  { max: 0.74, icon: '🔴', label: 'Advanced Fibrosis (F3)',      fib: 'F3 — Severe',   fat: '> 66%' },
  { max: 1.00, icon: '⛔', label: 'Cirrhosis (F4)',              fib: 'F4 — Cirrhosis',fat: '> 66%' },
];

function updateInfo(frac) {
  const stage = stages.find(s => frac <= s.max) || stages[stages.length-1];
  document.getElementById('statusIcon').textContent  = stage.icon;
  document.getElementById('statusValue').textContent = stage.label;

  // Fibrosis bar only starts at F2 (frac >= 0.5)
  const fibFrac = Math.max(0, (frac - 0.5) / 0.5);
  document.getElementById('mFib').style.width = (fibFrac * 100) + '%';
  document.getElementById('mFib').style.background = `hsl(${30 - fibFrac*20},55%,${38 - fibFrac*12}%)`;
  document.getElementById('vFib').textContent = stage.fib;

  const fatPct = Math.round(Math.max(0, (frac - 0.1) / 0.9) * 100);
  document.getElementById('mFat').style.width = fatPct + '%';
  document.getElementById('vFat').textContent = stage.fat;
}

// ── Drag interaction ─────────────────────────────────────────────────
let dragging = false;

function getFrac(e) {
  const r = wrapper.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
}

wrapper.addEventListener('mousedown',  e => { dragging = true; draw(getFrac(e)); });
wrapper.addEventListener('touchstart', e => { dragging = true; draw(getFrac(e)); }, {passive:true});
window.addEventListener('mousemove',  e => { if (dragging) draw(getFrac(e)); });
window.addEventListener('touchmove',  e => { if (dragging) draw(getFrac(e)); }, {passive:true});
window.addEventListener('mouseup',  () => dragging = false);
window.addEventListener('touchend', () => dragging = false);
</script>
